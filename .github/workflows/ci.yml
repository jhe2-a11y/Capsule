name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  web:
    name: web-viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck

  supabase:
    name: supabase-migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          # The migrations reference auth.users + storage; in CI we stub those
          # schemas so the SQL still type-checks (for full RLS tests run
          # `supabase start` locally).
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          -- Roles that Supabase provisions automatically; plain Postgres
          -- doesn't have them, so the migrations' GRANTs would fail.
          do $do$ begin
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role;
            end if;
          end $do$;
          create schema if not exists auth;
          create table if not exists auth.users (
            id uuid primary key,
            email text
          );
          create schema if not exists storage;
          create table if not exists storage.buckets (
            id text primary key, name text, public boolean,
            file_size_limit bigint
          );
          create table if not exists storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text references storage.buckets(id),
            name text, owner uuid
          );
          create or replace function auth.uid() returns uuid
            language sql stable as $$ select null::uuid $$;
          do $do$ begin
            create publication supabase_realtime;
          exception when duplicate_object then null;
          end $do$;
          SQL
          for f in supabase/migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done

  ios:
    name: ios-build
    runs-on: macos-14
    env:
      DEVELOPER_DIR: ""   # populated by the discovery step below
    steps:
      - uses: actions/checkout@v4

      # Use whichever Xcode the runner has. Pinning to a specific path
      # (e.g. /Applications/Xcode_15.4.app) breaks when the runner image
      # is updated or the version is dropped. Pick the highest Xcode_*
      # bundle present and fall back to the runner default.
      - name: Discover Xcode
        run: |
          set -euo pipefail
          DEVELOPER_DIR=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sort -V | tail -1)/Contents/Developer
          if [ -z "$DEVELOPER_DIR" ] || [ ! -d "$DEVELOPER_DIR" ]; then
            DEVELOPER_DIR=$(xcode-select -p)
          fi
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Capsule.xcodeproj \
            -scheme Capsule

      # Discover an available iPhone simulator's UDID + name via jq
      # (preinstalled on macos-14). Avoids hardcoding device names and
      # avoids the `name=...,OS=latest` matching pitfalls — passing the
      # UDID directly resolves to exactly one destination.
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/sims.json
          PICK=$(jq -r '
            [.devices | to_entries[]
              | select(.key | test("iOS"))
              | {runtime: .key, devices: .value}
              | .devices[]
              | select(.isAvailable and (.name | test("^iPhone")))
              | "\(.udid)|\(.name)"]
            | first' /tmp/sims.json)
          if [ -z "$PICK" ] || [ "$PICK" = "null" ]; then
            echo "no iPhone simulator available; runtimes seen:"
            jq -r '.devices | keys[]' /tmp/sims.json
            exit 1
          fi
          UDID="${PICK%%|*}"
          NAME="${PICK#*|}"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Picked simulator: $NAME ($UDID)"

      - name: Build
        working-directory: ios
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project Capsule.xcodeproj \
            -scheme Capsule \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcodebuild-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo ""
            echo "::group::Compile errors (filtered)"
            grep -E "error:|warning:|note:|FAILED:" /tmp/xcodebuild-build.log \
              | head -120 || true
            echo "::endgroup::"
            {
              echo "## iOS build failed"
              echo ""
              echo "<details><summary>Compile errors / warnings</summary>"
              echo ""
              echo '```'
              grep -E "error:|warning:|note:|FAILED:" /tmp/xcodebuild-build.log \
                | head -120 || true
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Test
        working-directory: ios
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project Capsule.xcodeproj \
            -scheme Capsule \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee /tmp/xcodebuild-test.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo ""
            echo "::group::Test failures (filtered)"
            grep -E "error:|warning:|FAILED:|XCTAssert|failed:" \
              /tmp/xcodebuild-test.log | head -120 || true
            echo "::endgroup::"
          fi
          exit "$rc"

      - name: Upload xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: /tmp/xcodebuild-*.log
          if-no-files-found: ignore
