name: Capsule
options:
  bundleIdPrefix: app.capsule
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  # Pin the .xcodeproj's objectVersion / compatibilityVersion to a format
  # Xcode 15 can read. Recent xcodegen defaults to the Xcode 16 format
  # (objectVersion 77), which fails the macos-14 runner's Xcode 15.4 with
  # "future Xcode project file format (77)". Pinning here makes the
  # project portable across both Xcode 15 and 16.
  xcodeVersion: "15.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: 2.13.0
targets:
  Capsule:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Capsule
        excludes:
          - "Resources/Info.plist"
          - "Resources/Capsule.entitlements"
    resources:
      - Capsule/Resources/Config.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.capsule
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Capsule/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Capsule/Resources/Capsule.entitlements
        ENABLE_BITCODE: NO
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        SWIFT_OBJC_BRIDGING_HEADER: ""
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Supabase
        product: Supabase
  CapsuleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CapsuleTests
    dependencies:
      - target: Capsule
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Capsule.app/Capsule
schemes:
  Capsule:
    build:
      targets:
        Capsule: all
        CapsuleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CapsuleTests
    archive:
      config: Release
