name: Capsule
options:
  bundleIdPrefix: app.capsule
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: 2.13.0
targets:
  Capsule:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Capsule
        excludes:
          - "Resources/Info.plist"
          - "Resources/Capsule.entitlements"
    resources:
      - Capsule/Resources/Config.plist
    info:
      path: Capsule/Resources/Info.plist
    entitlements:
      path: Capsule/Resources/Capsule.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.capsule
        CODE_SIGN_ENTITLEMENTS: Capsule/Resources/Capsule.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Capsule/Resources/Info.plist
        ENABLE_BITCODE: NO
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        SWIFT_OBJC_BRIDGING_HEADER: ""
    dependencies:
      - package: Supabase
        product: Supabase
  CapsuleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CapsuleTests
    dependencies:
      - target: Capsule
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Capsule.app/Capsule
schemes:
  Capsule:
    build:
      targets:
        Capsule: all
        CapsuleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CapsuleTests
    archive:
      config: Release
